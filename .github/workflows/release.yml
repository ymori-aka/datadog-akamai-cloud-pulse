name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ddev
        run: |
          pipx install ddev
          ddev config set repos.extras "$GITHUB_WORKSPACE"
          ddev config set repo extras
      - name: Check tag matches package version
        run: |
          version=$(sed -n "s/^__version__ = '\(.*\)'/\1/p" akamai_cloud_pulse/datadog_checks/akamai_cloud_pulse/__about__.py)
          test "v${version}" = "${GITHUB_REF_NAME}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build wheel
        run: ddev release build akamai_cloud_pulse
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/datadog-agent-akamai-cloud-pulse:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/datadog-agent-akamai-cloud-pulse:latest
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" akamai_cloud_pulse/dist/*.whl \
            --title "$GITHUB_REF_NAME" --notes-file akamai_cloud_pulse/CHANGELOG.md
